<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Alu Lord</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
:root{
--bg:#000000;
--card:rgba(28,28,30,0.72);
--card2:rgba(44,44,46,0.65);
--border:rgba(255,255,255,0.12);
--text:#ffffff;
--sub:rgba(235,235,245,0.6);
--input:rgba(120,120,128,0.24);
--accent:#0A84FF;
--accentText:#ffffff;
--danger:#FF453A;
--btn:rgba(116,116,128,0.24);
--shadow:0 12px 30px rgba(0,0,0,0.4);
--radius:16px;
--sticky-bg:rgba(0,0,0,0.75);
}
[data-theme="light"]{
--bg:#F2F2F7;
--card:rgba(255,255,255,0.8);
--card2:rgba(255,255,255,0.95);
--border:rgba(60,60,67,0.12);
--text:#000000;
--sub:rgba(60,60,67,0.6);
--input:rgba(118,118,128,0.12);
--accent:#007AFF;
--accentText:#ffffff;
--danger:#FF3B30;
--btn:rgba(116,116,128,0.12);
--shadow:0 10px 25px rgba(0,0,0,0.06);
--sticky-bg:rgba(242,242,247,0.85);
}

*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}

body{
min-height:100vh;
color:var(--text);
display:flex;
justify-content:center;
padding:0;
background:var(--bg);
transition:background 0.3s ease;
-webkit-font-smoothing:antialiased;
}

.app-container{
width:100%;
max-width:440px;
min-height:100vh;
display:flex;
flex-direction:column;
background:transparent;
position:relative;
padding-bottom:20px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 20px;
position:sticky;
top:0;
z-index:30;
background:rgba(20,20,20,0.65);
border-bottom:0.5px solid var(--border);
backdrop-filter:blur(20px) saturate(180%);
-webkit-backdrop-filter:blur(20px) saturate(180%);
}
[data-theme="light"] .top-bar{
background:rgba(249,249,249,0.78);
}

.brand-title{
font-size:17px;
font-weight:600;
letter-spacing:-0.4px;
color:var(--text);
cursor:pointer;
user-select:none;
}

.admin-badge {
  font-size: 10px;
  background: var(--accent);
  color: #fff;
  padding: 2px 6px;
  border-radius: 6px;
  margin-left: 6px;
  vertical-align: middle;
  display: none;
}

.settings-btn{
width:32px;
height:32px;
border-radius:50%;
border:none;
background:var(--input);
color:var(--accent);
font-size:16px;
display:flex;
align-items:center;
justify-content:center;
font-weight:600;
}

.content-area{padding:16px;flex:1}

/* Sticky Back Button Styling */
.back-nav-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--sticky-bg);
  border: none;
  border-bottom: 0.5px solid var(--border);
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  padding: 10px 16px;
  margin: -16px -16px 14px -16px;
  position: sticky;
  top: 49px;
  z-index: 25;
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  transition: opacity 0.15s ease;
}
.back-nav-btn:active {
  opacity: 0.6;
}
.back-nav-btn .arrow {
  font-size: 18px;
  line-height: 1;
}

.card{
background:var(--card);
border:0.5px solid var(--border);
border-radius:var(--radius);
padding:16px;
margin-bottom:16px;
box-shadow:var(--shadow);
backdrop-filter:blur(30px) saturate(190%);
-webkit-backdrop-filter:blur(30px) saturate(190%);
}

.card-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.item-label{
font-size:12px;
font-weight:600;
color:var(--sub);
text-transform:uppercase;
letter-spacing:-0.1px;
}

.card-delete-btn{
width:26px;
height:26px;
border-radius:50%;
border:none;
background:rgba(255,69,58,0.15);
color:var(--danger);
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
}

.grid-3{display:grid;grid-template-columns:1fr 1fr .8fr;gap:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

.input-wrapper{display:flex;flex-direction:column}
.input-wrapper label{
font-size:11px;
font-weight:500;
color:var(--sub);
margin:0 0 6px 2px;
text-transform:uppercase;
letter-spacing:0.2px;
}

input,select{
width:100%;
height:40px;
background:var(--input);
border:none;
border-radius:10px;
color:var(--text);
padding:8px 12px;
font-size:14px;
text-align:center;
outline:none;
-webkit-appearance:none;
appearance:none;
font-weight:400;
}

input:disabled {
 opacity: 0.6;
 cursor: not-allowed;
}

input::placeholder{color:var(--sub);opacity:0.7}
input:focus,select:focus{
box-shadow:0 0 0 2px var(--accent);
}

select option{background:#2c2c2e;color:#fff}
[data-theme="light"] select option{background:#ffffff;color:#000}

.btn-row{display:flex;gap:10px;margin-top:6px}

button{
cursor:pointer;
border:none;
border-radius:12px;
font-weight:600;
font-size:14px;
padding:12px;
transition:all 0.15s ease;
}

button:active{transform:scale(0.97);opacity:0.8}

.btn-blue{
width:48px;
font-size:20px;
padding:0;
color:var(--accent);
background:var(--input);
display:flex;
align-items:center;
justify-content:center;
}

.btn-dark{
background:var(--input);
color:var(--accent);
flex:1;
}

.btn-run{
width:100%;
margin-top:14px;
padding:14px;
border-radius:14px;
background:var(--accent);
color:var(--accentText);
font-size:15px;
font-weight:600;
box-shadow:0 4px 12px rgba(0,122,255,0.3);
}

.nav-btn{
background:var(--card);
border:0.5px solid var(--border);
border-radius:var(--radius);
padding:16px;
margin-bottom:16px;
box-shadow:var(--shadow);
width:100%;
display:flex;
justify-content:space-between;
align-items:center;
color:var(--text);
font-size:14px;
font-weight:600;
backdrop-filter:blur(30px) saturate(190%);
-webkit-backdrop-filter:blur(30px) saturate(190%);
}
.nav-btn .icon{color:var(--sub);font-size:16px;}

.screen{display:block}.hidden{display:none!important}

table{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
th{
color:var(--sub);
border-bottom:0.5px solid var(--border);
padding:0 0 8px;
text-align:left;
font-size:11px;
font-weight:600;
text-transform:uppercase;
letter-spacing:0.2px;
}
td{padding:12px 2px;border-bottom:0.5px solid var(--border)}
.clickable-row{cursor:pointer}
.clickable-row:active{opacity:0.6}
.text-right{text-align:right}
.highlight-qty{color:var(--accent);font-weight:600}

.section-divider{
  background:rgba(255,255,255,0.05);
  font-weight:600;
  color:var(--accent);
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.section-divider td{padding:8px 6px;border-bottom:1px solid var(--border)}

.btn-action-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn-action{
background:var(--input);
border:none;
color:var(--accent);
padding:12px;
border-radius:12px;
font-size:13px;
font-weight:500;
}

.error-msg{color:var(--danger);font-size:12px;margin-top:8px;display:none;font-weight:500}

.tab-header{
display:flex;
gap:2px;
padding:2px;
background:var(--input);
border-radius:9px;
margin-bottom:14px;
}
.tab-btn{
flex:1;
padding:7px;
background:transparent;
color:var(--sub);
border:none;
font-size:12px;
font-weight:500;
border-radius:7px;
transition:all 0.2s ease;
}
.tab-btn.active{
color:var(--text);
background:var(--card2);
box-shadow:0 2px 6px rgba(0,0,0,0.15);
font-weight:600;
}

.swiper-container{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.swiper-container::-webkit-scrollbar{display:none}
.swipe-page{flex:0 0 100%;scroll-snap-align:start;width:100%}

.bar-container{
background:var(--input);
border-radius:8px;
height:34px;
width:100%;
display:flex;
overflow:hidden;
margin-bottom:8px;
position:relative;
}
.bar-piece{
height:100%;
background:var(--accent);
border-right:1px solid rgba(255,255,255,0.2);
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
color:#fff;
font-weight:600;
padding:0 2px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}
.bar-waste{
background:rgba(255,69,58,0.15);
color:var(--danger);
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
flex:1;
font-weight:500;
}

.glass-sheet-box {
  width: 100%;
  aspect-ratio: 1 / 1;
  background: rgba(120, 120, 128, 0.1);
  border: 1.5px dashed var(--border);
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  margin: 8px auto 16px;
}

.glass-piece-box {
  position: absolute;
  background: rgba(10, 132, 255, 0.45);
  border: 1px solid var(--accent);
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  padding: 2px;
  box-sizing: border-box;
  text-align: center;
}

.layout-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-top: 14px;
}

.list-item-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:0.5px solid var(--border);font-size:13px}
#settings-screen .card select,#settings-screen .card input, #pricing-screen .card input{text-align:left}

/* Login Modal Styling */
.modal-overlay {
  position: fixed;
  top:0; left:0; right:0; bottom:0;
  background: rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.modal-box {
  background: var(--card2);
  border: 0.5px solid var(--border);
  padding: 20px;
  border-radius: var(--radius);
  width: 90%;
  max-width: 340px;
  box-shadow: var(--shadow);
}
.modal-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 14px;
  text-align: center;
}

@media(max-width:380px){.content-area{padding:12px}.card{padding:14px}.grid-3{gap:6px}}
</style>
</head>
<body data-theme="light">

<div class="app-container">
  
  <div class="top-bar">
    <div class="brand-title" onclick="handleBrandClick()">
      Alu Lord <span id="admin-badge" class="admin-badge">ADMIN</span>
    </div>
    <button class="settings-btn" id="settings-toggle-btn" onclick="openSettings()" title="Settings">⚙</button>
  </div>

  <div class="content-area">
    
    <!-- Input Screen -->
    <div id="input-screen" class="screen">
      <div id="item-list"></div>

      <div class="btn-row">
        <button class="btn-blue" onclick="addItem()">+</button>
        <button class="btn-dark" id="lbl-clear-all" onclick="clearAll()">clear all</button>
      </div>

      <button class="btn-run" id="lbl-run" onclick="calculateCutList()">run_calculation</button>
    </div>

    <!-- Settings Screen -->
    <div id="settings-screen" class="screen hidden">
      <button class="back-nav-btn" id="lbl-back" onclick="closeSettings()" title="Back"></button>

      <button class="nav-btn" onclick="openPricingScreen()">
        <span id="lbl-pricing-menu" style="text-transform: uppercase; font-size: 13px; color: var(--accent);">728 Pricing Category</span>
        <span class="icon">➔</span>
      </button>

      <div class="card">
        <div class="card-header">
          <span class="item-label" id="lbl-settings">SETTINGS</span>
        </div>
        
        <div class="input-wrapper" style="margin-bottom: 12px;">
          <label id="lbl-unit">measurement unit</label>
          <select id="global-unit" onchange="convertAllUnits()">
            <option value="feet">ft / in (fractional)</option>
            <option value="mm">mm</option>
          </select>
        </div>

        <div class="grid-2" style="margin-top:0; margin-bottom: 12px;">
          <div class="input-wrapper">
            <label id="lbl-glass-w">glass sheet width</label>
            <input type="text" id="global-glass-w" value="4'" class="unit-input" onchange="handleInchInput(this)">
          </div>
          <div class="input-wrapper">
            <label id="lbl-glass-h">glass sheet height</label>
            <input type="text" id="global-glass-h" value="6'" class="unit-input" onchange="handleInchInput(this)">
          </div>
        </div>

        <div class="input-wrapper" style="margin-bottom: 12px;">
          <label id="lbl-glass-price" style="color:var(--accent);">glass sheet price (per sheet)</label>
          <input type="number" id="global-glass-price" min="0" placeholder="price" class="pricing-input">
        </div>

        <div class="input-wrapper" style="margin-bottom: 12px;">
          <label id="lbl-ws-roll">weatherstrip roll length</label>
          <input type="text" id="global-ws-roll" value="150'" class="unit-input" onchange="handleInchInput(this)">
        </div>

        <div class="input-wrapper" style="margin-bottom: 12px;">
          <label id="lbl-kerf">saw blade kerf</label>
          <input type="text" id="global-kerf" value="0" class="unit-input" onchange="handleInchInput(this)">
        </div>

        <div class="input-wrapper" style="margin-bottom: 12px;">
          <label id="lbl-lang">language</label>
          <select id="global-lang" onchange="toggleLanguage()">
            <option value="en">English</option>
            <option value="my">မြန်မာစာ (Burmese)</option>
          </select>
        </div>

        <div class="input-wrapper">
          <label id="lbl-theme">color theme</label>
          <select id="global-theme" onchange="toggleTheme()">
            <option value="light">light</option>
            <option value="dark">dark</option>
          </select>
        </div>
      </div>
  
    </div>

    <!-- 728 Pricing Screen -->
    <div id="pricing-screen" class="screen hidden">
      <button class="back-nav-btn" id="lbl-pricing-back" onclick="closePricingScreen()" title="Back"></button>

      <div class="card">
        <div class="card-header">
          <span class="item-label" id="lbl-pricing-cat" style="color:var(--accent);">728 PRICING CATEGORY</span>
        </div>
        
        <div style="font-size:11px; color:var(--sub); margin-bottom:14px; margin-top:-6px;" id="lbl-pricing-desc">
          Enter unit prices to automatically calculate the total estimated cost.
        </div>

        <!-- Admin Save Button -->
        <button id="btn-save-cloud" class="btn-run hidden" style="margin-top:0; margin-bottom:16px; background:#34C759;" onclick="savePricingToCloud()">
          ☁ Save Prices to Cloud
        </button>

        <div class="input-wrapper" style="margin-bottom: 16px;">
          <label id="lbl-misc-price" style="color:var(--accent);">LABOR & MISC PRICE (PER SQFT)</label>
          <input type="number" id="global-misc-price" min="0" placeholder="price" class="pricing-input">
        </div>

        <div class="section-divider" style="background:transparent; padding:0; margin-bottom:8px; font-size:11px;" id="lbl-sec-profiles-price">Aluminium Profiles (Price per bar)</div>
        <div id="profiles-price-container" style="margin-bottom:16px;"></div>

        <div class="section-divider" style="background:transparent; padding:0; margin-bottom:8px; font-size:11px;" id="lbl-sec-acc-price">Accessories (Price per pc/roll)</div>
        <div class="grid-2" id="acc-price-container"></div>
      </div>
    </div>

    <!-- Output Screen -->
    <div id="output-screen" class="screen hidden">
      <button class="back-nav-btn" id="lbl-return" onclick="showInput()" title="Return"></button>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th id="lbl-tbl-item">item</th>
              <th class="text-right" id="lbl-tbl-bar">qty</th>
              <th class="text-right" id="lbl-tbl-cost">cost (Ks)</th>
            </tr>
          </thead>
          <tbody id="report-body"></tbody>
        </table>

        <div class="btn-action-group">
          <button class="btn-action" id="lbl-opti" onclick="copyOpticutterFormat()">copy for opticutter</button>
          <button class="btn-action" id="lbl-pdf" onclick="window.print()">print pdf</button>
        </div>
      </div>
    </div>

    <!-- Detail Screen -->
    <div id="detail-screen" class="screen hidden">
      <button class="back-nav-btn" id="lbl-detail-back" onclick="showOutput()" title="Back"></button>

      <div class="card">
        <div class="item-label" id="detail-item-title" style="font-size:14px; text-transform:uppercase; color:var(--accent); margin-bottom:12px;">ITEM DETAIL</div>

        <div class="tab-header">
          <button class="tab-btn active" id="tab-btn-text" onclick="switchTab(0)">Required List</button>
          <button class="tab-btn" id="tab-btn-visual" onclick="switchTab(1)">Cutting Diagram</button>
        </div>

        <div class="swiper-container" id="detail-swiper" onscroll="handleScroll()">
          <div class="swipe-page" id="page-list"></div>
          <div class="swipe-page" id="page-diagram"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Admin Login Modal -->
<div id="login-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-title">Admin Login</div>
    <div class="input-wrapper" style="margin-bottom: 10px;">
      <label>Email</label>
      <input type="email" id="login-email" placeholder="admin@alulord.com">
    </div>
    <div class="input-wrapper" style="margin-bottom: 14px;">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="••••••••">
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn-dark" onclick="closeLoginModal()">Cancel</button>
      <button class="btn-run" style="margin-top:0; flex:1;" onclick="performLogin()">Login</button>
    </div>
  </div>
</div>

<script>
  // -------------------------------------------------------------
  // FIREBASE CONFIGURATION ( Replace with your Firebase keys )
  // -------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyCr1nQWmuMLZCLEzuZvwIknIarTKhPhVw8",
  authDomain: "alu-lord.firebaseapp.com",
  projectId: "alu-lord",
  storageBucket: "alu-lord.firebasestorage.app",
  messagingSenderId: "1039089681865",
  appId: "1:1039089681865:web:ddca2f0ed0535a8852d418",
  measurementId: "G-4005X3C2QS"
  };

  // Initialize Firebase
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const auth = firebase.auth();
  const db = firebase.firestore();

  let isAdmin = false;

  // Track Firebase Auth State
  const ADMIN_EMAIL = "thegreatsonata2002@gmail.com";

// Case/whitespace-insensitive match against the configured admin email.
function isAdminUser(user) {
  return !!user && typeof user.email === 'string' &&
    user.email.trim().toLowerCase() === ADMIN_EMAIL.trim().toLowerCase();
}

auth.onAuthStateChanged(user => {

  if (isAdminUser(user)) {

    // Admin
    isAdmin = true;

    document.getElementById('admin-badge').style.display = 'inline-block';
    document.getElementById('btn-save-cloud').classList.remove('hidden');

    togglePricingFieldsEditable(true);

  } else {

    // Public User
    isAdmin = false;

    document.getElementById('admin-badge').style.display = 'none';
    document.getElementById('btn-save-cloud').classList.add('hidden');

    // Public user can edit temporarily
    togglePricingFieldsEditable(true);
  }
});

  // Enable/Disable Pricing Inputs for Public vs Admin
  function togglePricingFieldsEditable(editable) {

  // Price inputs
  document.querySelectorAll('.pricing-input').forEach(input => {
    input.disabled = !editable;
  });

  // Aluminium stock length inputs
  document.querySelectorAll('#profiles-price-container input[id^="length-"]').forEach(input => {
    input.disabled = !editable;
  });
  }

  // Secret Click Mechanism on Title "Alu Lord"
  let titleClickCount = 0;
  let titleClickTimer = null;

  function handleBrandClick() {
    titleClickCount++;
    if (titleClickCount === 3) {
      titleClickCount = 0;
      clearTimeout(titleClickTimer);
      if (isAdmin) {
        if (confirm("Admin Mode သို့ ဝင်ထားပြီးဖြစ်သည်။ Logout ထွက်လိုပါသလား?")) {
          auth.signOut();
        }
      } else {
        document.getElementById('login-modal').classList.remove('hidden');
      }
    } else {
      clearTimeout(titleClickTimer);
      titleClickTimer = setTimeout(() => { titleClickCount = 0; }, 1000);
    }
  }

  function closeLoginModal() {
    document.getElementById('login-modal').classList.add('hidden');
  }

  function performLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-pass').value;

    auth.signInWithEmailAndPassword(email, pass)
      .then((cred) => {
        const u = (cred && cred.user) || auth.currentUser;
        if (!isAdminUser(u)) {
          // Login worked, but this account is not the configured admin, so the

  function formatFeetInches(totalInches) {
    if (totalInches == null || isNaN(totalInches)) return '';
    totalInches = Math.max(0, Number(totalInches));

    let sixteenths = Math.round(totalInches * 16);
    let feet = Math.floor(sixteenths / 192);
    let rem16 = sixteenths - feet * 192;
    let wholeInches = Math.floor(rem16 / 16);
    let frac16 = rem16 % 16;

    const fracMap = {
      1:'1/16', 2:'1/8', 3:'3/16', 4:'1/4',
      5:'5/16', 6:'3/8', 7:'7/16', 8:'1/2',
      9:'9/16', 10:'5/8', 11:'11/16', 12:'3/4',
      13:'13/16', 14:'7/8', 15:'15/16'
    };

    let out = '';
    if (feet > 0) out += feet + "'";
    if (wholeInches > 0 || frac16 > 0) {
      if (out) out += '-';
      out += wholeInches;
      if (frac16 > 0) out += ' ' + fracMap[frac16];
      out += '"';
    }
    return out || (totalInches === 0 ? '0"' : '');
  }

  function parseFraction(str) {
    str = String(str || '').trim();
    if (!str) return 0;
    if (str.includes('/')) {
      const p = str.split('/');
      const a = parseFloat(p[0]), b = parseFloat(p[1]);
      if (isFinite(a) && isFinite(b) && b !== 0) return a / b;
      return 0;
    }
    const n = parseFloat(str);
    return isFinite(n) ? n : 0;
  }

  function parseToInches(valStr, unit = currentUnit) {
    if (valStr == null || String(valStr).trim() === '') return 0;
    let s = String(valStr).trim().toLowerCase().replace(/,/g, '');

    if (unit === 'mm') {
      const n = parseFloat(s.replace(/mm/g, '').trim());
      return isFinite(n) ? n / 25.4 : 0;
    }

    let total = 0;
    const feetMatch = s.match(/^\s*(-?\d+(?:\.\d+)?)\s*'/);
    if (feetMatch) {
      total += parseFloat(feetMatch[1]) * 12;
      s = s.slice(feetMatch[0].length).trim();
    }

    s = s.replace(/"/g, '').replace(/-/g, ' ').trim();
    if (s) {
      const parts = s.split(/\s+/);
      total += parseFloat(parts[0]) || 0;
      if (parts[1]) total += parseFraction(parts[1]);
    }
    return Math.max(0, total);
  }

  function displayLength(inches) {
    if (inches === 0) return '0';
    return currentUnit === 'mm'
      ? (Math.round(inches * 25.4 * 100) / 100) + ' mm'
      : formatFeetInches(inches);
  }

  function handleInchInput(input) {
    if (!input.value || input.value.trim() === '') {
      delete input.dataset.inches;
      return;
    }
    const inches = parseToInches(input.value, currentUnit);
    input.dataset.inches = String(inches);
    input.value = displayLength(inches);
  }

  function convertAllUnits() {
    const newUnit = document.getElementById('global-unit').value;
    if (newUnit === currentUnit) return;

    document.querySelectorAll('.unit-input').forEach(field => {
      if (!field.value.trim() || field.value.trim() === '-') {
        field.value = '';
        delete field.dataset.inches;
        return;
      }

      let inches = parseFloat(field.dataset.inches);

      if (isNaN(inches) || !field.dataset.inches) {
        inches = parseToInches(field.value, currentUnit);
      }

      if (!isNaN(inches) && inches > 0) {
        field.dataset.inches = String(inches);

        if (newUnit === 'mm') {
          field.value = (Math.round(inches * 25.4 * 100) / 100) + ' mm';
        } else {
          field.value = formatFeetInches(inches);
        }
      } else {
        field.value = '';
        delete field.dataset.inches;
      }
    });

    currentUnit = newUnit;
  }
