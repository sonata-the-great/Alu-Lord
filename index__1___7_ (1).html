  function calculate1DStockBars(cutLengths, kerf, barLength) {
  if (!cutLengths || cutLengths.length === 0) {
    return { barCount: 0, bins: [], costingQty: 0 };
  }

  const EPS = 1e-9;

  // ---------------------------------------------------------
  // 1. Clean input
  // ---------------------------------------------------------
  const cuts = cutLengths
    .map(v => Number(v))
    .filter(v => Number.isFinite(v) && v > 0);

  if (cuts.length === 0) {
    return { barCount: 0, bins: [], costingQty: 0 };
  }

  // ---------------------------------------------------------
  // 2. Effective length
  // Keep the existing app's kerf behavior:
  // every cut consumes cut length + kerf
  // ---------------------------------------------------------
  const effective = v => v + kerf;

  // ---------------------------------------------------------
  // 3. Group identical lengths
  // ---------------------------------------------------------
  const groupsMap = new Map();

  for (const length of cuts) {
    const key = Math.round(length * 1000000) / 1000000;

    if (!groupsMap.has(key)) {
      groupsMap.set(key, 0);
    }

    groupsMap.set(key, groupsMap.get(key) + 1);
  }

  const groups = [...groupsMap.entries()]
    .map(([length, count]) => ({
      length: Number(length),
      count: count,
      effective: effective(Number(length))
    }))
    .sort((a, b) => b.effective - a.effective);

  // ---------------------------------------------------------
  // 4. Oversized pieces
  // ---------------------------------------------------------
  const oversizedBins = [];
  const normalGroups = [];

  for (const g of groups) {
    if (g.effective > barLength + EPS) {
      for (let i = 0; i < g.count; i++) {
        oversizedBins.push({
          cuts: [g.length],
          rem: 0,
          oversized: true
        });
      }
    } else {
      normalGroups.push(g);
    }
  }

  if (normalGroups.length === 0) {
    return {
      barCount: oversizedBins.length,
      bins: oversizedBins,
      costingQty: oversizedBins.length
    };
  }

  // ---------------------------------------------------------
  // 5. Fast fallback for complicated jobs
  //
  // Exact pattern solving is intentionally used only when
  // the number of different lengths is reasonable.
  // ---------------------------------------------------------
  const distinctCount = normalGroups.length;

  function heuristicPack() {
    const expanded = [];

    for (const g of normalGroups) {
      for (let i = 0; i < g.count; i++) {
        expanded.push(g.length);
      }
    }

    const orders = [];

    // Largest first
    orders.push([...expanded].sort((a, b) => b - a));

    // Smallest first
    orders.push([...expanded].sort((a, b) => a - b));

    // Alternating large / small
    {
      const s = [...expanded].sort((a, b) => b - a);
      const alt = [];

      let left = 0;
      let right = s.length - 1;

      while (left <= right) {
        alt.push(s[left++]);

        if (left <= right) {
          alt.push(s[right--]);
        }
      }

      orders.push(alt);
    }

    let best = null;

    function pack(order, mode) {
      const bins = [];

      for (const length of order) {
        const need = effective(length);

        let selected = -1;

        for (let i = 0; i < bins.length; i++) {
          if (bins[i].rem + EPS >= need) {

            if (mode === "best") {
              if (
                selected === -1 ||
                bins[i].rem - need <
                  bins[selected].rem - need
              ) {
                selected = i;
              }
            } else {
              selected = i;
              break;
            }
          }
        }

        if (selected === -1) {
          bins.push({
            cuts: [length],
            rem: barLength - need
          });
        } else {
          bins[selected].cuts.push(length);
          bins[selected].rem -= need;
        }
      }

      return bins;
    }

    for (const order of orders) {
      for (const mode of ["first", "best"]) {
        const bins = pack(order, mode);

        if (
          !best ||
          bins.length < best.length ||
          (
            bins.length === best.length &&
            bins.reduce((a, b) => a + b.rem, 0) <
              best.reduce((a, b) => a + b.rem, 0)
          )
        ) {
          best = bins;
        }
      }
    }

    return best || [];
  }

  // ---------------------------------------------------------
  // 6. Exact pattern generation
  //
  // Each pattern is:
  // [quantity of type 0,
  //  quantity of type 1,
  //  quantity of type 2, ...]
  //
  // A pattern must fit completely inside one stock bar.
  // ---------------------------------------------------------
  function generatePatterns() {
    const patterns = [];

    const quantities = new Array(normalGroups.length).fill(0);

    function generate(index, usedLength) {

      if (index === normalGroups.length) {

        if (usedLength > EPS) {
          patterns.push({
            counts: quantities.slice(),
            used: usedLength
          });
        }

        return;
      }

      // Stop as soon as the existing 5000-pattern limit is exceeded
      // (exactSolve() returns null in that case anyway).
      if (patterns.length > 5000) return;

      const g = normalGroups[index];
      const maxByLength = Math.floor(
        (barLength - usedLength + EPS) / g.effective
      );

      const maxQty = Math.min(
        g.count,
        Math.max(0, maxByLength)
      );

      for (let q = 0; q <= maxQty; q++) {

        if (patterns.length > 5000) break;

        quantities[index] = q;

        generate(
          index + 1,
          usedLength + q * g.effective
        );
      }

      quantities[index] = 0;
    }

    generate(0, 0);

    // Remove duplicate / empty patterns
    const seen = new Set();
    const unique = [];

    for (const p of patterns) {
      const key = p.counts.join(",");

      if (!seen.has(key)) {
        seen.add(key);
        unique.push(p);
      }
    }

    return unique;
  }

  // ---------------------------------------------------------
  // 6b. Minimum-bin-slack pattern filling (fallback improver)
  //
  // Fills one bar at a time with the subset of remaining pieces
  // that leaves the least slack (bounded depth-first search),
  // from several deterministic orderings. Deterministic: the
  // seed depends only on the input, so repeated calls agree.
  // ---------------------------------------------------------
  function patternFillPack(areaLB) {
    const G = normalGroups.length;
    const NODE_CAP = 4000;      // per bar, keeps phones responsive
    const RESTARTS = 14;
    let seed = 12345 + G * 977;
    const rand = () => {
      seed = (seed * 16807) % 2147483647;
      return (seed - 1) / 2147483646;
    };

    function fillOnce(order, mustHaveLargest) {
      const rem = normalGroups.map(g => g.count);
      let left = rem.reduce((a, b) => a + b, 0);
      const bins = [];

      while (left > 0) {
        const idx = order.filter(i => rem[i] > 0);
        const must = mustHaveLargest ? idx[0] : -1;

        const suffix = new Array(idx.length + 1).fill(0);
        for (let p = idx.length - 1; p >= 0; p--) {
          suffix[p] = suffix[p + 1] + rem[idx[p]] * normalGroups[idx[p]].effective;
        }

        const cur = new Array(G).fill(0);
        let bestUsed = -1;
        let bestCounts = null;
        let nodes = 0;

        (function dfs(p, used) {
          if (nodes++ > NODE_CAP || bestUsed >= barLength - EPS) return;

          if (p === idx.length) {
            if (used > bestUsed + EPS) {
              bestUsed = used;
              bestCounts = cur.slice();
            }
            return;
          }

          if (used + Math.min(suffix[p], barLength - used) <= bestUsed + EPS) return;

          const gi = idx[p];
          const g = normalGroups[gi];
          const maxQ = Math.min(
            rem[gi],
            Math.max(0, Math.floor((barLength - used + EPS) / g.effective))
          );
          const minQ = gi === must ? 1 : 0;

          for (let q = maxQ; q >= minQ; q--) {
            cur[gi] = q;
            dfs(p + 1, used + q * g.effective);
          }
          cur[gi] = 0;
        })(0, 0);

        if (!bestCounts) return null;

        const bin = { cuts: [], rem: 0 };
        let used = 0;
        for (let i = 0; i < G; i++) {
          for (let q = 0; q < bestCounts[i]; q++) {
            bin.cuts.push(normalGroups[i].length);
            used += normalGroups[i].effective;
          }
          rem[i] -= bestCounts[i];
          left -= bestCounts[i];
        }
        bin.cuts.sort((a, b) => b - a);
        bin.rem = barLength - used;
        bins.push(bin);
      }

      return bins;
    }

    const base = normalGroups.map((g, i) => i);   // already longest first
    let best = null;

    function consider(bins) {
      if (!bins) return;
      if (
        !best ||
        bins.length < best.length ||
        (
          bins.length === best.length &&
          Math.max(...bins.map(b => b.rem)) >
            Math.max(...best.map(b => b.rem)) + EPS
        )
      ) {
        best = bins;
      }
    }

    consider(fillOnce(base, true));
    if (best && best.length <= areaLB) return best;
    consider(fillOnce(base, false));

    for (let r = 0; r < RESTARTS; r++) {
      if (best && best.length <= areaLB) break;
      const order = base.slice();
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      consider(fillOnce(order, r % 2 === 0));
    }

    return best;
  }

  // ---------------------------------------------------------
  // 7. Exact solver
  // ---------------------------------------------------------
  function exactSolve() {

    // Avoid exponential explosion on extremely complicated jobs.
    if (distinctCount > 6) {
      return null;
    }

    const patterns = generatePatterns();

    if (patterns.length === 0) {
      return null;
    }

    // Safety fallback
    if (patterns.length > 5000) {
      return null;
    }

    // Patterns containing each material type
    const byType = normalGroups.map(() => []);

    patterns.forEach((pattern, patternIndex) => {
      pattern.counts.forEach((qty, typeIndex) => {
        if (qty > 0) {
          byType[typeIndex].push(patternIndex);
        }
      });
    });

    // Highest fill first
    for (const list of byType) {
      list.sort(
        (a, b) =>
          patterns[b].used - patterns[a].used
      );
    }

    const target = normalGroups.map(g => g.count);

    const totalRequired = normalGroups.reduce(
      (sum, g) => sum + g.count * g.effective,
      0
    );

    // Absolute theoretical lower bound
    const lowerBound = Math.max(
      1,
      Math.ceil((totalRequired - EPS) / barLength)
    );

    const memo = new Map();

    let searchNodes = 0;

    function stateKey(rem, barsLeft) {
      return rem.join(",") + "|" + barsLeft;
    }

    function search(rem, barsLeft) {

      searchNodes++;

      // Safety valve for pathological inputs.
      // Normal aluminium jobs should finish well before this.
      if (searchNodes > 250000) {
        return null;
      }

      let remainingPieces = 0;
      let remainingLength = 0;

      for (let i = 0; i < rem.length; i++) {
        remainingPieces += rem[i];
        remainingLength +=
          rem[i] * normalGroups[i].effective;
      }

      if (remainingPieces === 0) {
        return [];
      }

      if (barsLeft <= 0) {
        return null;
      }

      if (
        remainingLength >
        barsLeft * barLength + EPS
      ) {
        return null;
      }

      const minimumBars = Math.ceil(
        (remainingLength - EPS) / barLength
      );

      if (minimumBars > barsLeft) {
        return null;
      }

      const key = stateKey(rem, barsLeft);

      if (memo.has(key)) {
        return null;
      }

      // -----------------------------------------------------
      // Choose the most constrained material type.
      // -----------------------------------------------------
      let selectedType = -1;
      let selectedCandidates = null;

      for (let i = 0; i < rem.length; i++) {

        if (rem[i] <= 0) continue;

        const candidates = [];

        for (const patternIndex of byType[i]) {

          const pattern =
            patterns[patternIndex];

          let fits = true;

          for (let j = 0; j < rem.length; j++) {
            if (
              pattern.counts[j] >
              rem[j]
            ) {
              fits = false;
              break;
            }
          }

          if (fits) {
            candidates.push(patternIndex);
          }
        }

        if (candidates.length === 0) {
          memo.set(key, true);
          return null;
        }

        if (
          selectedCandidates === null ||
          candidates.length <
            selectedCandidates.length
        ) {
          selectedType = i;
          selectedCandidates = candidates;
        }
      }

      // -----------------------------------------------------
      // Try fuller patterns first.
      // -----------------------------------------------------
      selectedCandidates.sort(
        (a, b) =>
          patterns[b].used -
          patterns[a].used
      );

      for (const patternIndex of selectedCandidates) {

        const pattern =
          patterns[patternIndex];

        const nextRem = rem.map(
          (value, i) =>
            value - pattern.counts[i]
        );

        const result =
          search(nextRem, barsLeft - 1);

        if (result !== null) {
          return [
            patternIndex,
            ...result
          ];
        }
      }

      memo.set(key, true);

      return null;
    }

    // -----------------------------------------------------
    // Try the theoretical minimum first.
    // This is the important part for the OptiCutter
    // benchmark.
    // -----------------------------------------------------
    for (
      let barCount = lowerBound;
      barCount <= lowerBound + 10;
      barCount++
    ) {

      memo.clear();
      searchNodes = 0;

      const solution =
        search(
          target,
          barCount
        );

      if (solution !== null) {

        const bins = [];

        for (const patternIndex of solution) {

          const pattern =
            patterns[patternIndex];

          const bin = {
            cuts: [],
            rem: barLength - pattern.used
          };

          for (
            let i = 0;
            i < normalGroups.length;
            i++
          ) {

            const qty =
              pattern.counts[i];

            for (let q = 0; q < qty; q++) {
              bin.cuts.push(
                normalGroups[i].length
              );
            }
          }

          // Display large pieces first
          bin.cuts.sort(
            (a, b) => b - a
          );

          bins.push(bin);
        }

        return bins;
      }
    }

    return null;
  }

  // ---------------------------------------------------------
  // 8. Try exact optimizer first
  // ---------------------------------------------------------
  let bins = exactSolve();

  // If exact search is not suitable, use fallback.
  if (!bins) {
    bins = heuristicPack();
  }

  // ---------------------------------------------------------
  // 8b. Stronger fallback (minimum-bin-slack pattern filling).
  // Adopted ONLY when it needs strictly fewer bars than the
  // result above, so existing results are never made worse
  // and already-optimal results are left unchanged.
  // ---------------------------------------------------------
  {
    const totalEffective = normalGroups.reduce(
      (sum, g) => sum + g.count * g.effective, 0
    );
    const areaLB = Math.max(
      1, Math.ceil((totalEffective - EPS) / barLength)
    );

    if (bins.length > areaLB) {
      const alt = patternFillPack(areaLB);
      if (alt && alt.length < bins.length) {
        bins = alt;
      }
    }
  }

  // ---------------------------------------------------------
  // 9. Add oversized bars
  // ---------------------------------------------------------
  bins = [
    ...bins,
    ...oversizedBins
  ];

  // ---------------------------------------------------------
  // 10. Put the least-used normal bar last.
  //
  // This keeps the existing fractional costing logic
  // compatible with the app.
  // ---------------------------------------------------------
  bins.sort((a, b) => {

    if (a.oversized) return -1;
    if (b.oversized) return 1;

    const usedA =
      barLength - a.rem;

    const usedB =
      barLength - b.rem;

    return usedB - usedA;
  });

  // ---------------------------------------------------------
  // 11. Existing costingQty logic
  // ---------------------------------------------------------
  let costingQty = 0;

  if (bins.length > 0) {

    const fullBars = bins.length - 1;
    const lastBin = bins[bins.length - 1];

    let usedInches =
      barLength - lastBin.rem;

    if (lastBin.oversized) {
      usedInches = barLength;
    }

    const usedFt =
      usedInches / 12;

    let fraction = 0;

    if (usedFt > 0 && usedFt <= 1)
      fraction = 0.05;

    else if (usedFt > 1 && usedFt <= 2)
      fraction = 0.1;

    else if (usedFt > 2 && usedFt <= 3)
      fraction = 0.1666;

    else if (usedFt > 3 && usedFt <= 4)
      fraction = 0.2;

    else if (usedFt > 4 && usedFt <= 5)
      fraction = 0.25;

    else if (usedFt > 5 && usedFt <= 6.5)
      fraction = 0.333;

    else if (usedFt > 6.5 && usedFt <= 10)
      fraction = 0.5;

    else if (usedFt > 10 && usedFt <= 13)
      fraction = 0.666;

    else if (usedFt > 13)
      fraction = 1;

    costingQty =
      Math.round(
        (fullBars + fraction) * 1000
      ) / 1000;
  }

  return {
    barCount: bins.length,
    bins: bins,
    costingQty: costingQty
  };
  }

  function calculateGlassSheets(glassPieces, sheetW, sheetH, opts) {
    if (!Array.isArray(glassPieces) || glassPieces.length === 0 ||
        !(sheetW > 0) || !(sheetH > 0)) {
      return { sheetCount: 0, layouts: [], costingQty: 0 };
    }

    const EPS = 1e-7;
    const oversizedList = [];
    const validPieces = [];
    const unplaced = [];   // pieces that cannot be cut from the stock sheet

    glassPieces.forEach((p, index) => {
      const w = Number(p.w), h = Number(p.h);
      if (!(w > 0) || !(h > 0) || !Number.isFinite(w) || !Number.isFinite(h)) {
        unplaced.push({ w, h, reason: 'invalid size' });
        return;
      }
      if (!((w <= sheetW + EPS && h <= sheetH + EPS) ||
            (h <= sheetW + EPS && w <= sheetH + EPS))) {
        oversizedList.push(`${displayLength(w)} x ${displayLength(h)}`);
        unplaced.push({ w, h, reason: 'larger than the stock sheet' });
      } else {
        validPieces.push({
          w, h, area: w * h,
          label: `${displayLength(w)} x ${displayLength(h)}`,
          sourceIndex: index
        });
      }
    });

    if (oversizedList.length) {
      alert(`⚠️ Oversized Glass Warning:\nအောက်ပါ မှန်စများသည် Stock Sheet (${displayLength(sheetW)} x ${displayLength(sheetH)}) ထက် ကြီးနေပါသည် -\n\n` +
        [...new Set(oversizedList)].join('\n'));
    }
    if (!validPieces.length) return { sheetCount: 0, layouts: [], costingQty: 0, unplaced };

    // MaxRects packing: test many orderings and placement rules, then keep
    // the solution using the fewest sheets. Rotation is considered per piece.
    function pack(order, rule, preferWideStart) {
      const sheets = [];

      function scoreSpace(space, w, h) {
        const dw = space.w - w, dh = space.h - h;
        if (dw < -EPS || dh < -EPS) return null;
        if (rule === 'area') return space.w * space.h - w * h;
        if (rule === 'long') return Math.max(dw, dh);
        if (rule === 'short') return Math.min(dw, dh);
        if (rule === 'bottom') return space.y + h;
        return Math.min(dw, dh) * 100000 + Math.max(dw, dh); // best-short-side-fit
      }

      function splitFreeSpaces(sheet, used) {
        const next = [];
        for (const f of sheet.freeSpaces) {
          if (used.x >= f.x + f.w - EPS || used.x + used.w <= f.x + EPS ||
              used.y >= f.y + f.h - EPS || used.y + used.h <= f.y + EPS) {
            next.push(f);
            continue;
          }
          if (used.x > f.x + EPS) next.push({ x: f.x, y: f.y, w: used.x - f.x, h: f.h });
          if (used.x + used.w < f.x + f.w - EPS)
            next.push({ x: used.x + used.w, y: f.y, w: f.x + f.w - used.x - used.w, h: f.h });
          if (used.y > f.y + EPS) next.push({ x: f.x, y: f.y, w: f.w, h: used.y - f.y });
          if (used.y + used.h < f.y + f.h - EPS)
            next.push({ x: f.x, y: used.y + used.h, w: f.w, h: f.y + f.h - used.y - used.h });
        }
        // Remove empty rectangles and any rectangle contained by another.
        const clean = next.filter(f => f.w > EPS && f.h > EPS);
        sheet.freeSpaces = clean.filter((a, i) => !clean.some((b, j) =>
          i !== j && a.x >= b.x - EPS && a.y >= b.y - EPS &&
          a.x + a.w <= b.x + b.w + EPS && a.y + a.h <= b.y + b.h + EPS));
      }

      for (const item of order) {
        let best = null;
        for (let si = 0; si < sheets.length; si++) {
          const sh = sheets[si];
          for (const space of sh.freeSpaces) {
            for (const rotated of [false, true]) {
              if (rotated && Math.abs(item.w - item.h) < EPS) continue;
              const w = rotated ? item.h : item.w;
              const h = rotated ? item.w : item.h;
              const sc = scoreSpace(space, w, h);
              if (sc === null) continue;
              const candidate = { si, space, w, h, rotated, sc };
              if (!best || sc < best.sc - EPS ||
                  (Math.abs(sc - best.sc) <= EPS && (space.y < best.space.y ||
                  (space.y === best.space.y && space.x < best.space.x)))) best = candidate;
            }
          }
        }

        if (!best) {
          const sh = { pieces: [], freeSpaces: [{ x: 0, y: 0, w: sheetW, h: sheetH }] };
          sheets.push(sh);
          const space = sh.freeSpaces[0];
          let options = [
            { w: item.w, h: item.h, rotated: false },
            { w: item.h, h: item.w, rotated: true }
          ].filter(o => o.w <= sheetW + EPS && o.h <= sheetH + EPS);
          options.sort((a, b) => {
            // Try width-filling orientations as well as the original order.
            // This is essential for layouts such as two 3x4 pieces on a 4x6 sheet:
            // placing each as 4x3 leaves a usable 4x3 space for the next piece.
            if (preferWideStart) {
              const widthFitA = Math.abs(sheetW - a.w);
              const widthFitB = Math.abs(sheetW - b.w);
              if (Math.abs(widthFitA - widthFitB) > EPS) return widthFitA - widthFitB;
            }
            return (sheetW * sheetH - a.w * a.h) -
                   (sheetW * sheetH - b.w * b.h);
          });
          const chosen = options[0];
          if (!chosen) continue;
          best = { si: sheets.length - 1, space, ...chosen };
        }

        const sh = sheets[best.si];
        const used = {
          x: best.space.x, y: best.space.y, w: best.w, h: best.h
        };
        sh.pieces.push({
          ...item, x: used.x, y: used.y,
          placedW: used.w, placedH: used.h,
          rotated: !!best.rotated
        });
        splitFreeSpaces(sh, used);
      }
      return sheets;
    }

    const sorters = [
      (a,b) => b.area-a.area,
      (a,b) => Math.max(b.w,b.h)-Math.max(a.w,a.h),
      (a,b) => Math.min(b.w,b.h)-Math.min(a.w,a.h),
      (a,b) => b.w-a.w || b.h-a.h,
      (a,b) => b.h-a.h || b.w-a.w,
      (a,b) => (b.w+b.h)-(a.w+a.h),
      (a,b) => (b.area/a.area)-1
    ];
    let bestSheets = null;
    let bestScore = null;
    // Fewer legacy iterations on larger jobs: the added search below does the
    // heavy lifting, and phones need to stay responsive.
    const tries = validPieces.length > 150 ? 20 : validPieces.length > 60 ? 28 : 80;

    for (let run = 0; run < tries; run++) {
      const sorter = sorters[run % sorters.length];
      let order = validPieces.slice().sort(sorter);
      // Deterministic tie-breaking variants, followed by seeded shuffle variants.
      if (run % 2 === 1) order.reverse();
      if (run >= sorters.length * 2) {
        let seed = run * 7919 + validPieces.length * 104729;
        const rand = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        };
        // Shuffle within similar-size groups to explore different placements.
        for (let i = order.length - 1; i > 0; i--) {
          const j = Math.floor(rand() * (i + 1));
          [order[i], order[j]] = [order[j], order[i]];
        }
      }
      const result = pack(order, ['short','area','long','bottom'][run % 4], run % 2 === 1);
      const wasteShape = result.reduce((sum, sh) => {
        const used = sh.pieces.reduce((a,p) => a + p.area, 0);
        const largestFree = sh.freeSpaces.reduce((m,f) => Math.max(m, f.w*f.h), 0);
        return sum + (sheetW * sheetH - used - largestFree) + sh.freeSpaces.length * 0.001;
      }, 0);
      const score = [result.length, wasteShape];
      if (!bestScore || score[0] < bestScore[0] ||
          (score[0] === bestScore[0] && score[1] < bestScore[1] - EPS)) {
        bestSheets = result;
        bestScore = score;
      }
    }

    // =====================================================================
    // Improved search (added). The original global MaxRects result above is
    // kept as the starting champion, so the sheet count can never get worse.
    // Added candidates: sheet-by-sheet filling (MaxRects + guillotine) and a
    // deterministic ruin-and-recreate local search. No wall-clock limits are
    // used, so repeated calls always return the same layout.
    // =====================================================================
    const effortBase = (opts && opts.effort > 0) ? opts.effort : 2;
    // Search effort shrinks as the job grows so phones stay responsive
    // (deterministic: depends only on the piece count, never on the clock).
    const effort = (opts && opts.effort > 0)
      ? effortBase
      : effortBase * Math.max(0.35, Math.min(1, 90 / validPieces.length));
    const SHEET_AREA = sheetW * sheetH;
    const usedArea = sh => sh.pieces.reduce((a, q) => a + q.area, 0);

    // --- Lower bound (valid, not necessarily tight) ----------------------
    let totalArea = 0, largeCount = 0, minHeightSum = 0, minWidthSum = 0;
    for (const it of validPieces) {
      totalArea += it.area;
      const ors = [[it.w, it.h], [it.h, it.w]]
        .filter(o => o[0] <= sheetW + EPS && o[1] <= sheetH + EPS);
      if (ors.every(o => o[0] > sheetW / 2 + EPS && o[1] > sheetH / 2 + EPS)) largeCount++;
      // Pieces wider than half the sheet in every orientation must be stacked
      // vertically on a sheet; pieces taller than half must sit side by side.
      if (ors.every(o => o[0] > sheetW / 2 + EPS)) minHeightSum += Math.min(...ors.map(o => o[1]));
      if (ors.every(o => o[1] > sheetH / 2 + EPS)) minWidthSum += Math.min(...ors.map(o => o[0]));
    }
    const lowerBound = Math.max(
      1,
      Math.ceil(totalArea / SHEET_AREA - 1e-9),
      largeCount,
      Math.ceil(minHeightSum / sheetH - 1e-9),
      Math.ceil(minWidthSum / sheetW - 1e-9)
    );

    // --- Deterministic RNG -----------------------------------------------
    let rs = 987654321 + validPieces.length * 7919;
    const rnd = () => { rs = (rs * 16807) % 2147483647; return (rs - 1) / 2147483646; };
    const shuffle = arr => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    };

    // --- Placement primitives ---------------------------------------------
    const newSheet = () => ({ pieces: [], freeSpaces: [{ x: 0, y: 0, w: sheetW, h: sheetH }] });

    function scoreFit(rule, space, w, h) {
      const dw = space.w - w, dh = space.h - h;
      if (dw < -EPS || dh < -EPS) return null;
      if (rule === 'baf') return space.w * space.h - w * h;
      if (rule === 'blsf') return Math.max(dw, dh) * 100000 + Math.min(dw, dh);
      if (rule === 'bl') return (space.y + h) * 100000 + space.x;
      return Math.min(dw, dh) * 100000 + Math.max(dw, dh);          // 'bssf'
    }

    function findInSheet(sh, it, rule) {
      let best = null;
      for (let si = 0; si < sh.freeSpaces.length; si++) {
        const space = sh.freeSpaces[si];
        for (let r = 0; r < 2; r++) {
          if (r === 1 && Math.abs(it.w - it.h) < EPS) continue;
          const w = r ? it.h : it.w, h = r ? it.w : it.h;
          const sc = scoreFit(rule, space, w, h);
          if (sc === null) continue;
          if (!best || sc < best.sc - EPS ||
              (Math.abs(sc - best.sc) <= EPS &&
               (space.y < best.space.y || (space.y === best.space.y && space.x < best.space.x)))) {
            best = { space, si, w, h, rotated: !!r, sc };
          }
        }
      }
      return best;
    }

    function maxrectsSplit(sh, used) {
      const next = [];
      for (const f of sh.freeSpaces) {
        if (used.x >= f.x + f.w - EPS || used.x + used.w <= f.x + EPS ||
            used.y >= f.y + f.h - EPS || used.y + used.h <= f.y + EPS) { next.push(f); continue; }
        if (used.x > f.x + EPS) next.push({ x: f.x, y: f.y, w: used.x - f.x, h: f.h });
        if (used.x + used.w < f.x + f.w - EPS)
          next.push({ x: used.x + used.w, y: f.y, w: f.x + f.w - used.x - used.w, h: f.h });
        if (used.y > f.y + EPS) next.push({ x: f.x, y: f.y, w: f.w, h: used.y - f.y });
        if (used.y + used.h < f.y + f.h - EPS)
          next.push({ x: f.x, y: used.y + used.h, w: f.w, h: f.y + f.h - used.y - used.h });
      }
      const clean = next.filter(f => f.w > EPS && f.h > EPS);
      sh.freeSpaces = clean.filter((a, i) => !clean.some((b, j) =>
        i !== j && a.x >= b.x - EPS && a.y >= b.y - EPS &&
        a.x + a.w <= b.x + b.w + EPS && a.y + a.h <= b.y + b.h + EPS &&
        !(a.x === b.x && a.y === b.y && a.w === b.w && a.h === b.h && j > i)));
    }

    function guillotineSplit(sh, c, rule) {
      const sp = c.space, rw = sp.w - c.w, rh = sp.h - c.h;
      sh.freeSpaces.splice(c.si, 1);
      let horizontal;
      if (rule === 'h') horizontal = true;
      else if (rule === 'v') horizontal = false;
      else if (rule === 'slas') horizontal = rw < rh;
      else horizontal = rw >= rh;                                    // 'llas'
      const right = horizontal
        ? { x: sp.x + c.w, y: sp.y, w: rw, h: c.h }
        : { x: sp.x + c.w, y: sp.y, w: rw, h: sp.h };
      const bottom = horizontal
        ? { x: sp.x, y: sp.y + c.h, w: sp.w, h: rh }
        : { x: sp.x, y: sp.y + c.h, w: c.w, h: rh };
      if (right.w > EPS && right.h > EPS) sh.freeSpaces.push(right);
      if (bottom.w > EPS && bottom.h > EPS) sh.freeSpaces.push(bottom);
    }

    function commit(sh, it, c, cb) {
      sh.pieces.push({ ...it, x: c.space.x, y: c.space.y,
                       placedW: c.w, placedH: c.h, rotated: c.rotated });
      if (cb.mode === 'guil') guillotineSplit(sh, c, cb.split);
      else maxrectsSplit(sh, { x: c.space.x, y: c.space.y, w: c.w, h: c.h });
    }

    const COMBOS = [
      { rule: 'bssf', mode: 'max' }, { rule: 'baf', mode: 'max' },
      { rule: 'blsf', mode: 'max' }, { rule: 'bl', mode: 'max' },
      { rule: 'bssf', mode: 'guil', split: 'slas' }, { rule: 'baf', mode: 'guil', split: 'llas' },
      { rule: 'bssf', mode: 'guil', split: 'h' },    { rule: 'bssf', mode: 'guil', split: 'v' },
      { rule: 'baf', mode: 'guil', split: 'slas' },  { rule: 'blsf', mode: 'guil', split: 'llas' }
    ];

    function fillSheet(items, cb) {
      const sh = newSheet(), left = [];
      for (const it of items) {
        const c = findInSheet(sh, it, cb.rule);
        if (c) commit(sh, it, c, cb); else left.push(it);
      }
      return { sheet: sh, left };
    }

    // Fill one sheet at a time; for every sheet keep the combo that packs
    // the most area into it.
    function packBySheetBest(items, combos) {
      const sheets = [];
      let rest = items;
      while (rest.length) {
        let bestR = null, bestU = -1;
        for (const cb of combos) {
          const r = fillSheet(rest, cb);
          const u = usedArea(r.sheet);
          if (u > bestU + EPS || (Math.abs(u - bestU) <= EPS && bestR && r.left.length < bestR.left.length)) {
            bestU = u; bestR = r;
          }
        }
        if (!bestR || !bestR.sheet.pieces.length) return null;
        sheets.push(bestR.sheet);
        rest = bestR.left;
      }
      return sheets;
    }

    // --- Solution scoring ---------------------------------------------------
    function isGuil(rects) {
      if (rects.length <= 1) return true;
      for (let axis = 0; axis < 2; axis++) {
        for (const r0 of rects) {
          const cut = axis ? r0.y + r0.placedH : r0.x + r0.placedW;
          const A = [], B = [];
          let ok = true;
          for (const r of rects) {
            const lo = axis ? r.y : r.x, hi = lo + (axis ? r.placedH : r.placedW);
            if (hi <= cut + EPS) A.push(r);
            else if (lo >= cut - EPS) B.push(r);
            else { ok = false; break; }
          }
          if (ok && A.length && B.length) return isGuil(A) && isGuil(B);
        }
      }
      return false;
    }

    function evalSol(sheets) {
      let nonG = 0, minUsed = Infinity, unusable = 0;
      for (const sh of sheets) {
        if (sh._g === undefined) sh._g = isGuil(sh.pieces);
        if (!sh._g) nonG++;
        const u = usedArea(sh);
        minUsed = Math.min(minUsed, u);
        const largest = sh.freeSpaces.reduce((m, f) => Math.max(m, f.w * f.h), 0);
        unusable += SHEET_AREA - u - largest;
      }
      return { sheets, n: sheets.length, nonG, minUsed, unusable };
    }

    // Fewest sheets first; then fully cuttable (guillotine) layouts; then the
    // emptiest sheet as empty as possible (one large reusable remnant); then
    // the least fragmented free space.
    function better(a, b) {
      if (!b) return true;
      if (a.n !== b.n) return a.n < b.n;
      if (a.nonG !== b.nonG) return a.nonG < b.nonG;
      if (Math.abs(a.minUsed - b.minUsed) > EPS) return a.minUsed < b.minUsed;
      return a.unusable < b.unusable - EPS;
    }

    function validateSheets(sheets) {
      const seen = new Set();
      let count = 0;
      for (const sh of sheets) {
        for (let i = 0; i < sh.pieces.length; i++) {
          const a = sh.pieces[i];
          if (a.x < -EPS || a.y < -EPS ||
              a.x + a.placedW > sheetW + EPS || a.y + a.placedH > sheetH + EPS) return false;
          const okDims = (Math.abs(a.placedW - a.w) < EPS && Math.abs(a.placedH - a.h) < EPS) ||
                         (Math.abs(a.placedW - a.h) < EPS && Math.abs(a.placedH - a.w) < EPS);
          if (!okDims) return false;
          for (let j = i + 1; j < sh.pieces.length; j++) {
            const b = sh.pieces[j];
            if (a.x < b.x + b.placedW - EPS && b.x < a.x + a.placedW - EPS &&
                a.y < b.y + b.placedH - EPS && b.y < a.y + a.placedH - EPS) return false;
          }
          if (seen.has(a.sourceIndex)) return false;
          seen.add(a.sourceIndex);
          count++;
        }
      }
      return count === validPieces.length;
    }

    let champion = evalSol(bestSheets || []);
    const offer = sheets => {
      if (!sheets || !validateSheets(sheets)) return;
      const e = evalSol(sheets);
      if (better(e, champion)) champion = e;
    };

    // --- Phase 1: sheet-by-sheet constructions ----------------------------
    const n = validPieces.length;
    const extraOrders = Math.max(3, Math.min(30, Math.round(effort * 700 / Math.max(n, 1))));
    const orders = [];
    for (const sorter of sorters) {
      orders.push(validPieces.slice().sort(sorter));
    }
    for (let k = 0; k < extraOrders; k++) {
      const o = validPieces.slice().sort(sorters[k % sorters.length]);
      // perturb: shuffle inside windows so large pieces still lead
      const win = 2 + (k % 4);
      for (let i = 0; i < o.length; i += win) {
        const seg = shuffle(o.slice(i, i + win));
        for (let t = 0; t < seg.length; t++) o[i + t] = seg[t];
      }
      orders.push(o);
    }
    for (const o of orders) offer(packBySheetBest(o, COMBOS));

    // --- Phase 2: ruin-and-recreate on the emptiest sheets ------------------
    const strip = q => ({ w: q.w, h: q.h, area: q.area, label: q.label, sourceIndex: q.sourceIndex });
    const attemptsPerM = Math.max(2, Math.round(effort * 6));
    let improved = true, rounds = 0;
    while (improved && rounds < 4 * Math.ceil(effort)) {
      improved = false;
      rounds++;
      for (let m = 2; m <= Math.min(6, champion.n); m++) {
        for (let a = 0; a < attemptsPerM; a++) {
          const ranked = champion.sheets
            .map(sh => ({ sh, u: usedArea(sh) }))
            .sort((x, y) => x.u - y.u);
          let chosen = ranked.slice(0, m);
          if (a > 0) {
            const pool = shuffle(ranked.slice(0, Math.min(ranked.length, 3 * m)));
            chosen = pool.slice(0, m);
          }
          const chosenSet = new Set(chosen.map(c => c.sh));
          const rest = champion.sheets.filter(sh => !chosenSet.has(sh));
          let items = [];
          chosen.forEach(c => c.sh.pieces.forEach(q => items.push(strip(q))));
          items.sort(sorters[a % sorters.length]);
          if (a >= sorters.length) shuffle(items.sort(sorters[0]));
          const cand = packBySheetBest(items, COMBOS);
          if (!cand) continue;
          const before = champion;
          offer(rest.concat(cand));
          if (champion !== before) improved = true;
        }
      }
      // Once the sheet count is provably minimal and every sheet can be cut
      // edge-to-edge, further rounds only polish the remnant: stop here.
      if (champion.n === lowerBound && champion.nonG === 0) break;
    }

    // Safety net: if anything above ever produced an invalid layout, fall back
    // to the original MaxRects result.
    let finalSheets = champion.sheets;
    if (!validateSheets(finalSheets)) finalSheets = bestSheets || [];
    // Emptiest sheet last: keeps the costing rule (based on the last sheet)
    // and the reusable remnant consistent.
    finalSheets = finalSheets.slice().sort((a, b) => usedArea(b) - usedArea(a));

    const rawSheets = finalSheets;
    const layouts = [];
    rawSheets.forEach(sheet => {
      const layoutSig = JSON.stringify(sheet.pieces
        .map(p => `${p.x.toFixed(3)},${p.y.toFixed(3)},${p.placedW.toFixed(3)},${p.placedH.toFixed(3)}`)
        .sort());
      const existing = layouts.find(l => l.sig === layoutSig);
      if (existing) existing.repetition++;
      else layouts.push({ sig: layoutSig, repetition: 1, sheet });
    });

    // Preserve the app's existing fractional costing rule for the final sheet.
    let costingQty = 0;
    if (rawSheets.length) {
      const fullSheets = rawSheets.length - 1;
      const lastSheet = rawSheets[rawSheets.length - 1];
      const usedArea = lastSheet.pieces.reduce((sum, p) => sum + p.area, 0);
      const sheetArea = sheetW * sheetH;
      const ratio = sheetArea > 0 ? usedArea / sheetArea : 0;
      costingQty = fullSheets + (ratio <= 0.5 ? 0.5 : 1);
    }
    const usedTotal = rawSheets.reduce((a, sh) => a + usedArea(sh), 0);
    const stockTotal = rawSheets.length * sheetW * sheetH;
    const largestOffcut = rawSheets.reduce((m, sh) =>
      sh.freeSpaces.reduce((mm, f) => Math.max(mm, f.w * f.h), m), 0);
    return {
      sheetCount: rawSheets.length, layouts, costingQty,
      usedArea: usedTotal, stockArea: stockTotal,
      remainingArea: stockTotal - usedTotal,
      utilization: stockTotal > 0 ? usedTotal / stockTotal : 0,
      largestOffcutArea: largestOffcut,
      lowerBound, provenOptimal: rawSheets.length === lowerBound,
      unplaced
    };
  }

  function calculateCutList() {
    const items = document.querySelectorAll('#item-list .card');
    const kerf = getKerfInches();

    const glassWInput = document.getElementById('global-glass-w');
    let glassW = parseFloat(glassWInput.dataset.inches) || parseToInches(glassWInput.value, currentUnit);

    const glassHInput = document.getElementById('global-glass-h');
    let glassH = parseFloat(glassHInput.dataset.inches) || parseToInches(glassHInput.value, currentUnit);

    const wsRollInput = document.getElementById('global-ws-roll');
    let wsRollInches = parseFloat(wsRollInput.dataset.inches) || parseToInches(wsRollInput.value, currentUnit);
    let wsRollFt = wsRollInches > 0 ? (wsRollInches / 12) : 150;

    let hasValidationError = false;
    let validItemFound = false;
    let totalGrandCost = 0;
    let totalSqft = 0;

    calculatedProfileData = {
      'top frame': [],'top frame + fixed': [], 'btm frame': [], 'side frame': [], 'lock frame': [],
      'hook frame': [], 'wheel frame': [], 'fixed frame': [], 'fixed middle frame': [],
      'side fixed close (inner)': [], 'side fixed close (outer)': [], 'fixed click': [], 'meeting stile': [], 'glass': []
    };

    calculatedAccessoriesData = {
      topCap: 0, botCap: 0, wheel: 0, hookLock: 0, weatherstripFt: 0, wsRollFt: wsRollFt
    };

    items.forEach(item => {
      const errorMsg = item.querySelector('.error-msg');
      errorMsg.style.display = 'none';

      let hInput = item.querySelector('.door-h');
      let h = parseFloat(hInput.dataset.inches) || parseToInches(hInput.value, currentUnit) || 0;

      let wInput = item.querySelector('.door-w');
      let w = parseFloat(wInput.dataset.inches) || parseToInches(wInput.value, currentUnit) || 0;

      let qty = parseInt(item.querySelector('.door-qty').value) || 0;

      if (!qty || qty <= 0 || !h || h <= 0 || !w || w <= 0) return;

      validItemFound = true;

      let slide = parseInt(item.querySelector('.slide-type').value);

      let topInput = item.querySelector('.top-fixed');
      let topFixed = parseFloat(topInput.dataset.inches) || parseToInches(topInput.value, currentUnit) || 0;

      let botInput = item.querySelector('.bot-fixed');
      let botFixed = parseFloat(botInput.dataset.inches) || parseToInches(botInput.value, currentUnit) || 0;

      if ((topFixed + botFixed) >= h) {
        errorMsg.style.display = 'block';
        hasValidationError = true;
        return;
      }

      let wFt = Math.ceil((w / 12) * 2) / 2;
      let hFt = Math.ceil((h / 12) * 2) / 2;
      let itemSqft = wFt * hFt;

      totalSqft += (itemSqft * qty);

      let panelW = slide === 2 ? w / 2 : w / 4;
      let doorH = h - (topFixed + botFixed);

      // Glass widths only: keep aluminium/profile calculations unchanged.
      // Fixed glass: 2-slide = (opening width - 4") / 2;
      //              4-slide = (opening width - 5") / 4.
      // Door glass:  2-slide = (opening width - 6") / 2;
      //              4-slide = (opening width - 8") / 4.
      const fixedGlassW = (w - (slide === 2 ? 4 : 5)) / slide;
      const doorGlassW = (w - (slide === 2 ? 5 : 7)) / slide;

      let panels = slide;
      calculatedAccessoriesData.topCap += panels * 2 * qty;
      calculatedAccessoriesData.botCap += panels * 2 * qty;
      calculatedAccessoriesData.wheel += panels * 2 * qty;

      if (slide === 2) calculatedAccessoriesData.hookLock += 2 * qty;
      else if (slide === 4) calculatedAccessoriesData.hookLock += 3 * qty;

      // Weatherstrip = total Lock Frame length × 2
let totalLockFrameFt = (doorH / 12) * slide;
calculatedAccessoriesData.weatherstripFt += totalLockFrameFt * 2 * qty;

      for (let i = 0; i < qty; i++) {
        if (topFixed > 0) {
          calculatedProfileData['top frame + fixed'].push(w);
        } else {
          calculatedProfileData['top frame'].push(w);
        }

        calculatedProfileData['btm frame'].push(w);
        calculatedProfileData['side frame'].push(h, h);

        let leafCount = slide;
        for (let j = 0; j < leafCount; j++) {
          calculatedProfileData['lock frame'].push(doorH);
          calculatedProfileData['hook frame'].push(doorH);
          calculatedProfileData['wheel frame'].push(panelW, panelW);
          calculatedProfileData['glass'].push({ w: doorGlassW, h: doorH });
        }

        if (slide === 4) {
          calculatedProfileData['meeting stile'].push(doorH);
        }

        let hasTop = topFixed > 0;
        let hasBot = botFixed > 0;

        if (hasTop) {
          for (let g = 0; g < slide; g++) calculatedProfileData['glass'].push({ w: fixedGlassW, h: topFixed });
        }
        if (hasBot) {
          for (let g = 0; g < slide; g++) calculatedProfileData['glass'].push({ w: fixedGlassW, h: botFixed });
        }

        let fixedCount = (hasTop ? 1 : 0) + (hasBot ? 1 : 0);
        if (fixedCount > 0) {
          for(let f=0; f<fixedCount; f++) calculatedProfileData['fixed frame'].push(w);

          let midQty = slide === 2 ? 1 : 3;
          if (hasTop) for(let m=0; m<midQty; m++) calculatedProfileData['fixed middle frame'].push(topFixed);
          if (hasBot) for(let m=0; m<midQty; m++) calculatedProfileData['fixed middle frame'].push(botFixed);

          if (hasTop) calculatedProfileData['side fixed close (inner)'].push(topFixed, topFixed);
          if (hasBot) calculatedProfileData['side fixed close (inner)'].push(botFixed, botFixed);
          if (hasBot) calculatedProfileData['side fixed close (outer)'].push(w);

          let clickQtyH = slide === 2 ? 4 : 8;
          let clickQtyW = slide === 2 ? 4 : 8;
          if (hasTop) {
            for(let c=0; c<clickQtyH; c++) calculatedProfileData['fixed click'].push(topFixed);
            for(let c=0; c<clickQtyW; c++) calculatedProfileData['fixed click'].push(panelW);
          }
          if (hasBot) {
            for(let c=0; c<clickQtyH; c++) calculatedProfileData['fixed click'].push(botFixed);
            for(let c=0; c<clickQtyW; c++) calculatedProfileData['fixed click'].push(panelW);
          }
        }
      }
    });

    if (hasValidationError) {
      alert(i18n[currentLang].errFixed);
      return;
    }

    if (!validItemFound) {
      alert(i18n[currentLang].errEmpty);
      return;
    }

    const tbody = document.getElementById('report-body');
    tbody.innerHTML = '';

    // Section 1: Profiles
    tbody.innerHTML += `<tr class="section-divider"><td colspan="3">${i18n[currentLang].secProfiles}</td></tr>`;
    for (let profile in calculatedProfileData) {
      if (profile === 'glass') continue;
      let itemsList = calculatedProfileData[profile];
      if (itemsList.length > 0) {
        let barLength = getProfileLength(profile);
        let result = calculate1DStockBars(itemsList, kerf, barLength);
        let rawCost = result.costingQty * getPrice(profile);
        let roundedCost = Math.ceil(rawCost / 100) * 100;
        totalGrandCost += roundedCost;

        tbody.innerHTML += `
          <tr class="clickable-row" onclick="openItemDetail('${profile}')">
            <td>${profile} ➔</td>
            <td class="text-right highlight-qty">${result.costingQty} bar</td>
            <td class="text-right">${roundedCost > 0 ? roundedCost.toLocaleString() : '-'}</td>
          </tr>
        `;
      }
    }

    // Section 2: Glass
    tbody.innerHTML += `<tr class="section-divider"><td colspan="3">${i18n[currentLang].secGlass}</td></tr>`;
    let glassList = calculatedProfileData['glass'];
    if (glassList.length > 0) {
      let sheetRes = calculateGlassSheets(glassList, glassW, glassH);
      let rawCost = sheetRes.costingQty * getPrice('glass');
      let roundedCost = Math.ceil(rawCost / 100) * 100;
      totalGrandCost += roundedCost;

      tbody.innerHTML += `
        <tr class="clickable-row" onclick="openItemDetail('glass')">
          <td>glass ➔</td>
          <td class="text-right highlight-qty">${sheetRes.costingQty} sheet</td>
          <td class="text-right">${roundedCost > 0 ? roundedCost.toLocaleString() : '-'}</td>
        </tr>
      `;
    }

    // Section 3: Accessories
    tbody.innerHTML += `<tr class="section-divider"><td colspan="3">${i18n[currentLang].secAcc}</td></tr>`;
    let rawWsRolls = calculatedAccessoriesData.weatherstripFt / calculatedAccessoriesData.wsRollFt;
    let wsRolls = Math.ceil(rawWsRolls / 0.25) * 0.25;

    let accItems = [
      { name: 'top cap', qtyStr: `${calculatedAccessoriesData.topCap} pcs`, qtyVal: calculatedAccessoriesData.topCap },
      { name: 'bot cap', qtyStr: `${calculatedAccessoriesData.botCap} pcs`, qtyVal: calculatedAccessoriesData.botCap },
      { name: 'wheel', qtyStr: `${calculatedAccessoriesData.wheel} pcs`, qtyVal: calculatedAccessoriesData.wheel },
      { name: 'hook lock', qtyStr: `${calculatedAccessoriesData.hookLock} pcs`, qtyVal: calculatedAccessoriesData.hookLock },
      { name: 'weatherstrip', qtyStr: `${wsRolls} roll`, qtyVal: wsRolls }
    ];

    accItems.forEach(acc => {
      let rawCost = acc.qtyVal * getPrice(acc.name);
      let roundedCost = Math.ceil(rawCost / 100) * 100;
      totalGrandCost += roundedCost;

      tbody.innerHTML += `
        <tr class="clickable-row" onclick="openItemDetail('${acc.name}')">
          <td>${acc.name} ➔</td>
          <td class="text-right highlight-qty">${acc.qtyStr}</td>
          <td class="text-right">${roundedCost > 0 ? roundedCost.toLocaleString() : '-'}</td>
        </tr>
      `;
    });

    // Section 4: Labor & Miscellaneous
    let miscPricePerSqft = parseFloat(document.getElementById('global-misc-price').value) || 0;
    let miscCost = Math.ceil((totalSqft * miscPricePerSqft) / 100) * 100;
    totalGrandCost += miscCost;

    tbody.innerHTML += `<tr class="section-divider"><td colspan="3">${i18n[currentLang].secMisc}</td></tr>`;
    tbody.innerHTML += `
      <tr>
        <td>${i18n[currentLang].totalArea} ➔</td>
        <td class="text-right highlight-qty">${totalSqft.toFixed(2)} sqft</td>
        <td class="text-right">${miscCost > 0 ? miscCost.toLocaleString() : '-'}</td>
      </tr>
    `;

    let pricePerSqft = totalSqft > 0 ? (totalGrandCost / totalSqft) : 0;

    tbody.innerHTML += `
      <tr style="border-top: 2px solid var(--accent);">
        <td colspan="2" class="text-right" id="lbl-grand-total" style="font-weight: bold; color: var(--accent); padding-top:16px;">
          ${i18n[currentLang].grandTotal}
        </td>
        <td class="text-right highlight-qty" style="font-size:15px; padding-top:16px;">
          ${totalGrandCost > 0 ? totalGrandCost.toLocaleString() : '0'} Ks
        </td>
      </tr>
      <tr>
        <td colspan="2" class="text-right" id="lbl-per-sqft" style="color: var(--sub); font-size:12px; padding-top:4px; padding-bottom:16px;">
          ${i18n[currentLang].perSqft}
        </td>
        <td class="text-right highlight-qty" style="font-size:13px; color: var(--sub); padding-top:4px; padding-bottom:16px;">
          ${pricePerSqft > 0 ? Math.ceil(pricePerSqft).toLocaleString() : '0'} Ks / sqft
        </td>
      </tr>
    `;

    document.getElementById('input-screen').classList.add('hidden');
    document.getElementById('output-screen').classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  function openItemDetail(profileName) {
    document.getElementById('detail-item-title').innerText = profileName;

    const pageList = document.getElementById('page-list');
    const pageDiagram = document.getElementById('page-diagram');

    let isAcc = ['top cap', 'bot cap', 'wheel', 'hook lock', 'weatherstrip'].includes(profileName);
    if (isAcc) {
      let detailText = '';
      if (profileName === 'top cap') detailText = `${calculatedAccessoriesData.topCap} pcs`;
      else if (profileName === 'bot cap') detailText = `${calculatedAccessoriesData.botCap} pcs`;
      else if (profileName === 'wheel') detailText = `${calculatedAccessoriesData.wheel} pcs`;
      else if (profileName === 'hook lock') detailText = `${calculatedAccessoriesData.hookLock} pcs`;
      else if (profileName === 'weatherstrip') {
        let rawWsRolls = calculatedAccessoriesData.weatherstripFt / calculatedAccessoriesData.wsRollFt;
        let wsRolls = Math.ceil(rawWsRolls / 0.25) * 0.25;
        detailText = `${wsRolls} roll(s) [Total: ${calculatedAccessoriesData.weatherstripFt.toFixed(1)} ft]`;
      }

      pageList.innerHTML = `
        <div class="list-item-row">
          <span>${profileName.toUpperCase()}</span>
          <span style="color:var(--accent); font-weight:600;">${detailText}</span>
        </div>
      `;
      pageDiagram.innerHTML = `
        <div style="padding: 20px; text-align: center; color: var(--sub); font-size: 13px;">
          No cutting diagram required for accessories.
        </div>
      `;

      document.getElementById('output-screen').classList.add('hidden');
      document.getElementById('detail-screen').classList.remove('hidden');
      switchTab(0);
      window.scrollTo(0, 0);
      return;
    }

    if (profileName === 'glass') {
      const glassWInput = document.getElementById('global-glass-w');
      let glassW = parseFloat(glassWInput.dataset.inches) || parseToInches(glassWInput.value, currentUnit);

      const glassHInput = document.getElementById('global-glass-h');
      let glassH = parseFloat(glassHInput.dataset.inches) || parseToInches(glassHInput.value, currentUnit);

      const glassPieces = calculatedProfileData['glass'];
      const { sheetCount, layouts, costingQty, usedArea, stockArea, remainingArea, utilization, largestOffcutArea, lowerBound, provenOptimal, unplaced } = calculateGlassSheets(glassPieces, glassW, glassH);

      let listHTML = `<div style="margin-bottom:10px; font-size:12px; color:var(--sub);">Total Glass Panels: ${glassPieces.length} | Costing Qty: ${costingQty} Sheet(s)</div>`;
      let counts = {};
      glassPieces.forEach(p => {
        let formatted = `${displayLength(p.w)} x ${displayLength(p.h)}`;
        counts[formatted] = (counts[formatted] || 0) + 1;
      });

      for (let sizeStr in counts) {
        listHTML += `
          <div class="list-item-row">
            <span>${sizeStr}</span>
            <span style="color:var(--accent); font-weight:600;">${counts[sizeStr]} pcs</span>
          </div>
        `;
      }
      pageList.innerHTML = listHTML;

      let diagramHTML = `<div style="margin-bottom:10px; font-size:12px; color:var(--sub);">Required Stocks: ${sheetCount} Sheet(s) (${displayLength(glassW)} x ${displayLength(glassH)})</div>`;
      
      // Optimizer statistics (areas shown in sqft, like the rest of the app)
      const sqft = a => (a / 144).toFixed(2);
      if (sheetCount > 0) {
        diagramHTML += `<div style="margin-bottom:6px; font-size:12px; color:var(--sub);">Used ${sqft(usedArea)} of ${sqft(stockArea)} sqft (${(utilization * 100).toFixed(1)}%) | Remaining ${sqft(remainingArea)} sqft | Largest offcut ${sqft(largestOffcutArea)} sqft</div>`;
        diagramHTML += `<div style="margin-bottom:10px; font-size:12px; color:var(--sub);">${provenOptimal ? `Sheet count is optimal (equals lower bound ${lowerBound}).` : `Best layout found; lower bound is ${lowerBound} sheet(s), optimality not proven.`}</div>`;
      }
      if (unplaced && unplaced.length) {
        const groups = {};
        unplaced.forEach(u => {
          const k = `${Number.isFinite(u.w) && Number.isFinite(u.h) ? displayLength(u.w) + ' x ' + displayLength(u.h) : 'invalid'} (${u.reason})`;
          groups[k] = (groups[k] || 0) + 1;
        });
        diagramHTML += `<div style="margin-bottom:10px; font-size:12px; color:var(--danger);">Not placed - cannot be cut: ${Object.keys(groups).map(k => groups[k] + ' x ' + k).join('; ')}</div>`;
      }

      const charNames = ["A", "B", "C", "D", "E", "F"];

      layouts.forEach((layoutItem, idx) => {
        let layoutName = idx < charNames.length ? charNames[idx] : (idx + 1); // keeps A-F, then 7, 8, ... (no repeated names)
        diagramHTML += `
  <div class="layout-header">
    <span>Layout ${layoutName}</span>
    <span style="color:var(--accent);">${layoutItem.repetition}x</span>
  </div>
  <div 
    class="glass-sheet-box"
    style="
      aspect-ratio: ${glassW} / ${glassH};
      width: min(100%, ${Math.min(1000, (glassW / glassH) * 420)}px);
    "
  >
`;

        layoutItem.sheet.pieces.forEach(p => {
          let leftPct = (p.x / glassW) * 100;
          let topPct = (p.y / glassH) * 100;
          let widthPct = (p.placedW / glassW) * 100;
          let heightPct = (p.placedH / glassH) * 100;

          diagramHTML += `
            <div class="glass-piece-box" style="left:${leftPct}%; top:${topPct}%; width:${widthPct}%; height:${heightPct}%;">
              ${displayLength(p.placedW)} x ${displayLength(p.placedH)}
            </div>
          `;
        });

        diagramHTML += `</div>`;
      });

      pageDiagram.innerHTML = diagramHTML;

    } else {
      const kerf = getKerfInches();
      const cuts = calculatedProfileData[profileName];
      const barLength = getProfileLength(profileName);
      const { barCount, bins, costingQty } = calculate1DStockBars(cuts, kerf, barLength);

      let listHTML = `<div style="margin-bottom:10px; font-size:12px; color:var(--sub);">Total Pieces: ${cuts.length} | Costing Qty: ${costingQty} Bar(s)</div>`;
      let counts = {};
      cuts.forEach(c => {
        let formatted = displayLength(c);
        counts[formatted] = (counts[formatted] || 0) + 1;
      });

      for (let len in counts) {
        listHTML += `
          <div class="list-item-row">
            <span>${len}</span>
            <span style="color:var(--accent); font-weight:600;">${counts[len]} pcs</span>
          </div>
        `;
      }
      pageList.innerHTML = listHTML;

      let diagramHTML = `<div style="margin-bottom:10px; font-size:12px; color:var(--sub);">Stock Bars Pattern (${barCount} total):</div>`;

      bins.forEach((bin, idx) => {
        diagramHTML += `<div style="font-size:11px; margin-top:8px; margin-bottom:4px; color:var(--sub);">Bar #${idx + 1}</div>`;
        diagramHTML += `<div class="bar-container">`;
        
        bin.cuts.forEach(c => {
          let pct = (c / barLength) * 100;
          let displayLen = displayLength(c);
          diagramHTML += `<div class="bar-piece" style="width: ${pct}%;" title="${displayLen}">${displayLen}</div>`;
        });

        if (bin.oversized) {
          diagramHTML += `<div class="bar-waste" style="width:100%;">OVERSIZE</div>`;
        } else if (bin.rem > 0) {
          let remPct = (bin.rem / barLength) * 100;
          let remDisplay = displayLength(bin.rem);
          diagramHTML += `<div class="bar-waste" style="width: ${remPct}%;">offcut ${remDisplay}</div>`;
        }

        diagramHTML += `</div>`;
      });

      pageDiagram.innerHTML = diagramHTML;
    }

    document.getElementById('output-screen').classList.add('hidden');
    document.getElementById('detail-screen').classList.remove('hidden');
    switchTab(0);
    window.scrollTo(0, 0);
  }

  function switchTab(idx) {
    const container = document.getElementById('detail-swiper');
    const width = container.clientWidth;
    container.scrollTo({ left: idx * width, behavior: 'smooth' });

    const btnText = document.getElementById('tab-btn-text');
    const btnVisual = document.getElementById('tab-btn-visual');

    if (idx === 0) {
      btnText.classList.add('active');
      btnVisual.classList.remove('active');
    } else {
      btnVisual.classList.add('active');
      btnText.classList.remove('active');
    }
  }

  function handleScroll() {
    const container = document.getElementById('detail-swiper');
    const idx = Math.round(container.scrollLeft / container.clientWidth);
    const btnText = document.getElementById('tab-btn-text');
    const btnVisual = document.getElementById('tab-btn-visual');

    if (idx === 0) {
      btnText.classList.add('active');
      btnVisual.classList.remove('active');
    } else {
      btnVisual.classList.add('active');
      btnText.classList.remove('active');
    }
  }

  function copyOpticutterFormat() {
    let rows = document.querySelectorAll('#report-body tr');
    let text = "Item\tQty_Needed\n";
    rows.forEach(row => {
      if (row.classList.contains('section-divider')) return;
      if (row.id === 'lbl-grand-total' || row.querySelector('#lbl-grand-total')) return;
      if (row.querySelector('#lbl-per-sqft')) return;
      
      let cols = row.querySelectorAll('td');
      if (cols.length >= 2) {
        text += `${cols[0].innerText.replace(' ➔', '')}\t${cols[1].innerText}\n`;
      }
    });
    navigator.clipboard.writeText(text);
    alert('Copied to clipboard!');
  }

  // Initialize Data
  const initGlassW = document.getElementById('global-glass-w');
  const initGlassH = document.getElementById('global-glass-h');
  initGlassH.dataset.inches = String(parseToInches(initGlassH.value, 'feet'));
  const initWsRoll = document.getElementById('global-ws-roll');
  initWsRoll.dataset.inches = String(parseToInches(initWsRoll.value, 'feet'));

  initPricingInputs();
toggleLanguage();
addItem();

loadPricingFromCloud().then(() => {
  loadTemporaryPricing();
});
</script>

</body>
</html>
